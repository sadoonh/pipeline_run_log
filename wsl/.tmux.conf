set -g escape-time 0
set -g focus-events 1
set -g renumber-windows 1
set -g default-shell "/bin/bash"
set -g base-index 1
set -g history-limit 50000
set -g allow-rename off
set -g set-clipboard on

# ---------- Prefix ----------
unbind C-b
set -g prefix C-s
bind C-s send-prefix
set -g mouse on
set -g default-terminal "xterm-256color"

bind-key R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ---------- Pane resizing ----------
bind-key -r S-Left  resize-pane -L 5
bind-key -r S-Down  resize-pane -D 5
bind-key -r S-Up    resize-pane -U 5
bind-key -r S-Right resize-pane -R 5

# ---------- Pane/window management ----------
bind-key r split-window -h -c "#{pane_current_path}"
bind-key b split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key x kill-pane
bind-key X kill-window
bind-key z resize-pane -Z

# Move between panes without prefix (Alt+arrow)
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Quick window switching without prefix (Alt+Shift+arrow)
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# Toggle synchronized input across panes (great for running the same command everywhere)
bind-key S set-window-option synchronize-panes \; display-message "Sync panes: #{?synchronize-panes,ON,OFF}"

# ---------- Copy mode ----------
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key p paste-buffer

### STATUS BAR ###
set -g status-style "bg=#3c3836,fg=#a89984"
set -g status-left "#[bg=#fb4934,fg=#3c3836]#{session_name} #[bg=#ffffff,fg=#282828] #(git -C #{pane_current_path} branch --show-current 2>/dev/null) #[bg=#504945,fg=#a89984]"
set -g status-left-length 500
set -g window-status-format "#[bg=#504945] #{window_index}-#{window_name} #{?#{==:#{window_index},#{last_window_index}},#[bg=#3c3836 fg=#504945],}"
set -g window-status-current-format "#[bg=#a89984,fg=#504945]#[fg=#282828] #{window_index}-#{window_name} #[bg=#504945,fg=#a89984]#{?#{==:#{window_index},#{last_window_index}},#[bg=#3c3836],}"
set -g window-status-separator ""
set -g status-right "#{pane_current_path} #[fg=#504945]#[bg=#504945,fg=#a89984]  #[bg=#a89984,fg=#fe8019]#[bg=#fe8019,fg=#3c3836] #(date +%a-%b-%d) #[fg=#fb4934]#[bg=#fb4934,fg=#3c3836] #(date +%H:%M) "
set -g status-right-length 500
set -g status-interval 1

# Flash the status bar briefly on activity in other windows
setw -g monitor-activity on
set -g visual-activity off

### PANES ###
set -g pane-base-index 1
set -g pane-border-format "#{?pane_active,\
#[fg=#3c3836 bg=#fe8019] Γû╢ #{pane_index}-#{pane_current_command} #[fg=#fe8019 bg=default]ΓùÇ,\
#[fg=#fe8019 bg=default] Γû╢ #{pane_index}-#{pane_current_command} #[fg=#fe8019]ΓùÇ}"
set -g pane-border-lines single
set -g pane-border-status 'top'
set -g pane-border-style fg=#fe8019
set -g pane-active-border-style fg=#fe8019

### PLUGINS ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Auto-save/restore sessions across reboots
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run -b '~/.tmux/plugins/tpm/tpm'
