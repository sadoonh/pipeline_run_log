# ---------- Prefix ----------
# Change tmux prefix from Ctrl-b to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ---------- Reload config ----------
# Prefix + R reloads ~/.tmux.conf
bind-key R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ---------- Pane resizing ----------
bind-key -r S-Left  resize-pane -L 5
bind-key -r S-Down  resize-pane -D 5
bind-key -r S-Up    resize-pane -U 5
bind-key -r S-Right resize-pane -R 5

# ---------- Splits ----------
bind-key r split-window -h -c "#{pane_current_path}"
bind-key b split-window -v -c "#{pane_current_path}"

# ---------- Windows and panes ----------
bind-key c new-window -c "#{pane_current_path}"
bind-key x kill-pane
bind-key X kill-window
bind-key z resize-pane -Z

# ---------- TPM plugins ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin flavor: latte, frappe, macchiato, mocha
set -g @catppuccin_flavor 'mocha'

# Initialize TPM - keep this at the very bottom
run -b '~/.tmux/plugins/tpm/tpm'
